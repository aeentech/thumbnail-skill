<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Thumbnail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800;900&family=Noto+Sans:wght@400;500;600;700;800;900&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --w: 1080px; --h: 720px; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; background: #000; }
  body { -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
  .canvas {
    position: relative; width: var(--w); height: var(--h); overflow: hidden; isolation: isolate;
    font-family: var(--font, "Noto Sans Arabic", "Noto Sans", sans-serif);
  }
  img { display: block; }

  :root {
    --font: "Noto Sans Arabic", "Noto Sans", sans-serif;
    --bg: #0b0b10;
    --fg: #ffffff;
    --primary: #6d5efc;
    --accent: #22d3ee;
  }
  .canvas { background: var(--bg); color: var(--fg); }
</style>
</head>
<body>
<div class="canvas">
</div>
<script>
(async () => {
  try { await document.fonts.ready; } catch {}
  await Promise.all([...document.images].map((i) => i.complete ? 0 : new Promise((r) => { i.onload = i.onerror = r; })));
  for (const el of document.querySelectorAll('[data-fit]')) {
    const lines = +el.dataset.fit || 3, min = +el.dataset.min || 24;
    let size = parseFloat(getComputedStyle(el).fontSize);
    const lh = () => { const v = getComputedStyle(el).lineHeight; return v === 'normal' ? size * 1.3 : parseFloat(v); };
    while (el.getBoundingClientRect().height > lh() * lines + 2 && size > min) { size -= 1; el.style.fontSize = size + 'px'; }
  }
  window.__ready = true;
})();
window.__ready = false;
</script>
</body>
</html>
